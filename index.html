
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">

        <h1>Quiz App</h1>

        <div id="inicio">
            <p>Responde las preguntas de conocimientos generales.</p>
            <button onclick="comenzar()">Comenzar</button>
        </div>

        <div id="quiz" style="display:none;">

            <h2 id="pregunta"></h2>

            <p>Tiempo: <span id="tiempo">60</span> segundos</p>

            <div id="opciones"></div>

            <p id="mensaje"></p>

            <button id="siguiente" onclick="siguiente()" style="display:none;">
                Siguiente
            </button>

        </div>

        <div id="final" style="display:none;">
            <h2>Examen terminado</h2>
            <p id="resultado"></p>
            <button onclick="location.reload()">Volver a jugar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
